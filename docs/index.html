<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0D0E0D">
  <title>RITM Premium Preview</title>
  <script>
    const query = new URLSearchParams(location.search);
    // Existing invitation tokens and actor links belong to the original demo database.
    const original = ['invite', 'choice', 'choice_result', 'as'].some(key => query.has(key));
    const destination = new URL(original ? './legacy.html' : './premium/meeting/', location.href);
    destination.search = location.search;
    destination.hash = location.hash;
    location.replace(destination.href);
  </script>
</head>
<body style="background:#0d0e0d;color:white;font:18px system-ui;padding:24px">
  <a href="./premium/meeting/" style="color:#d5fc53">Открыть RITM Premium Preview</a>
</body>
</html>
